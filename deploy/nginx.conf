server {
    listen 80;
    listen [::]:80;
    server_name woordwijs.alexanderclaes.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://woordwijs.alexanderclaes.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name woordwijs.alexanderclaes.com;
    ssl_certificate /etc/letsencrypt/live/woordwijs.alexanderclaes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woordwijs.alexanderclaes.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/woordwijs-static/current;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    location ~ /\. { deny all; }
    location /api/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_read_timeout 20s;
        client_max_body_size 64k;
        access_log off;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
